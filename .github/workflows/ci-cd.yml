name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests (if any)
      run: |
        echo "Running tests..."
        # Add your test commands here
        # python -m pytest tests/
    
    - name: Build Docker image
      run: |
        docker build -t flask-app:${{ github.sha }} .
        docker tag flask-app:${{ github.sha }} flask-app:latest
    
    - name: Run Docker container test
      run: |
        docker run -d -p 5000:5000 --name flask-test flask-app:latest
        sleep 5
        curl -f http://localhost:5000/health || exit 1
        docker stop flask-test
        docker rm flask-test
    
    - name: Deploy to Kubernetes (if on main branch)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "Deploying to Kubernetes..."
        # Add your kubectl deployment commands here
        # kubectl apply -f deployment.yaml
        # kubectl apply -f service.yaml
        # kubectl rollout status deployment/flask-app

